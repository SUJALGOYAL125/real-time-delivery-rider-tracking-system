events {}

http {
  # Define the pool of backend servers to balance across.
  # ip_hash makes requests from the same client IP consistently go to
  # the same backend instance — important for Socket.IO, since its
  # handshake process can otherwise get split across different servers
  # mid-connection, which would break the WebSocket upgrade.
  upstream backend_servers {
    ip_hash;
    server backend1:5000;
    server backend2:5000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend_servers;

      # Required headers so WebSocket upgrade requests (Socket.IO)
      # pass through NGINX correctly instead of being treated as
      # plain HTTP and failing to establish a real-time connection.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      proxy_pass http://backend_servers/health;
    }
  }
}