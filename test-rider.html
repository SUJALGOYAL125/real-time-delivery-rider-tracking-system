<!DOCTYPE html>
<html>
<head><title>Rider Test</title></head>
<body>
  <h2>Rider Test Client</h2>
  <input id="token" placeholder="Paste rider JWT token" style="width:500px"><br><br>
  <input id="orderId" placeholder="Order ID"><br><br>
  <button onclick="connect()">Connect</button>
  <button onclick="join()">Join Delivery</button><br><br>
  <input id="lat" placeholder="Latitude" value="28.6160">
  <input id="lng" placeholder="Longitude" value="77.2095"><br><br>
  <button onclick="sendLocation()">Send Location</button>
  <pre id="log"></pre>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    let socket;
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    function connect() {
      const token = document.getElementById("token").value;
      socket = io("http://localhost:5000", { auth: { token } });
      socket.on("connect", () => log("Connected: " + socket.id));
      socket.on("error", (err) => log("Error: " + JSON.stringify(err)));
      socket.on("connect_error", (err) => log("Connect error: " + err.message));
    }

    function join() {
      const orderId = document.getElementById("orderId").value;
      socket.emit("rider:join-delivery", { orderId });
      log("Sent join request for order " + orderId);
    }

    function sendLocation() {
      const orderId = document.getElementById("orderId").value;
      const latitude = parseFloat(document.getElementById("lat").value);
      const longitude = parseFloat(document.getElementById("lng").value);
      socket.emit("rider:location", { orderId, latitude, longitude, timestamp: Date.now() });
      log(`Sent location: ${latitude}, ${longitude}`);
    }
  </script>
</body>
</html>
